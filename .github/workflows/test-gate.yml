name: Test Gate

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: vendor
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.6.14"

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install project + dev tools (locked)
        run: uv sync --frozen

      - name: Run security regression test gate
        run: |
          uv run python -m unittest \
            tests.test_blindbox_state_wrap \
            tests.test_asyncio_regression \
            tests.test_blindbox_client \
            tests.test_atomic_writes \
            tests.test_chat_history \
            tests.test_history_ui_guards \
            tests.test_profile_import_overwrite \
            tests.test_protocol_framing_vnext \
            tests.test_sam_input_validation \
            tests.test_audit_remediation

      - name: Pytest suite
        run: uv run pytest tests/ -q --tb=short
